<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <!-- Content-Security-Policy: locks sources to self. 'wasm-unsafe-eval' +
       blob: are required by Flutter's CanvasKit/skwasm engine (self-hosted via
       --no-web-resources-cdn); 'unsafe-inline' style covers Flutter's injected
       styles; connect-src allows the runtime market.json fetch; fonts.gstatic.com
       is Flutter's CanvasKit glyph-fallback font source (Roboto/Noto). Note:
       frame-ancestors / X-Frame-Options need HTTP headers, which GitHub Pages
       can't set. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://raw.githubusercontent.com https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="referrer" content="no-referrer">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Track structured-product annuities — index-linked returns with cap, participation, and floor/buffer/barrier downside protection.">
  <meta name="theme-color" content="#1F3A5F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="iHaveAnnuities">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>iHaveAnnuities</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="webauthn.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
