# Dependabot version-update PRs. Vulnerability *alerts* are enabled separately
# in Settings → Code security → Dependabot alerts.
version: 2
updates:
  # Flutter/Dart packages (pubspec.yaml lives in /app).
  - package-ecosystem: "pub"
    directory: "/app"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # data_table_2 3.x moved to the standalone `material_ui` package, whose
      # DataRow/DataCell are distinct types from package:flutter/material's.
      # Taking it means migrating the whole app off flutter/material, so major
      # bumps stay out of the PR queue until that's a deliberate project.
      - dependency-name: "data_table_2"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
